name: keep-awake-loop
# GitHub throttles short cron schedules to every few hours, so each run
# stays alive ~5h50m and pings every 9 min. Public repo = free minutes.
on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
concurrency:
  group: keep-awake
  cancel-in-progress: false
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping every 9 minutes
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while [ $(date +%s) -lt $end ]; do
            curl -sS -o /dev/null -w "%{http_code} %{time_total}s $(date -u +%H:%M)\n" --max-time 90 https://vibecheck.itsvelocitygroup.com/api/health || true
            sleep 540
          done
