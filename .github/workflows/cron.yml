name: keep-awake-and-weekly
on:
  schedule:
    - cron: "*/10 * * * *"
    - cron: "0 14 * * 1"
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      weekly:
        description: "Also run the weekly rescan"
        type: boolean
        default: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE: https://vibecheck.itsvelocitygroup.com
    steps:
      - name: Ping health
        run: |
          curl -fsS --retry 5 --retry-delay 20 --retry-all-errors --max-time 90 "$BASE/api/health"
      - name: Weekly rescan
        if: github.event.schedule == '0 14 * * 1' || inputs.weekly
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/weekly"
      - name: Daily follow-up emails
        if: github.event.schedule == '0 15 * * *'
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 300 -H "Authorization: Bearer $CRON_SECRET" "$BASE/api/cron/nudges"
